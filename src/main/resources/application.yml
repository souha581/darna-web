spring:
  application:
    name: darna-web
  datasource:
    url: jdbc:h2:mem:darna;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Darna Web
    version: ${APP_VERSION:1.0.0}
    environment: ${SPRING_PROFILES_ACTIVE:default}

app:
  seed:
    enabled: ${APP_SEED_ENABLED:false}
    owner-username: ${APP_OWNER_USERNAME:owner}
    owner-password: ${APP_OWNER_PASSWORD:}
    resident-username: ${APP_RESIDENT_USERNAME:resident}
    resident-password: ${APP_RESIDENT_PASSWORD:}
    ouvrier-username: ${APP_OUVRIER_USERNAME:ouvrier}
    ouvrier-password: ${APP_OUVRIER_PASSWORD:}
