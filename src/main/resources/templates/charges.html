<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Charges & Paiements — DARNA</title>
    <link rel="stylesheet" th:href="@{/css/darna.css}">
</head>
<body>
<nav class="navbar">
    <a th:href="@{/dashboard}" class="brand">DARNA</a>
    <div class="nav-links">
        <a th:href="@{/dashboard}">Tableau de bord</a>
        <a th:if="${user.role.name() == 'OWNER'}" th:href="@{/apartments}">Appartements</a>
        <a th:href="@{/charges}">Charges & Paiements</a>
        <a th:href="@{/repairs}">Signalements</a>
        <form th:action="@{/logout}" method="post" style="display: inline;">
            <button type="submit" class="btn btn-sm btn-danger">Déconnexion</button>
        </form>
    </div>
</nav>

<div class="container">
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

    <div class="card" th:if="${user.role.name() == 'OWNER'}">
        <h3>Émettre une Charge de Copropriété</h3>
        <form th:action="@{/charges/issue}" method="post" class="form-inline">
            <div style="flex: 1; min-width: 180px;">
                <label>Appartement</label>
                <select name="apartmentId" required>
                    <option th:each="apt : ${apartments}" th:value="${apt.id}"
                            th:text="${apt.unitNumber + ' (Bât. ' + apt.buildingName + ')'}"></option>
                </select>
            </div>
            <div style="flex: 1; min-width: 180px;">
                <label>Libellé</label>
                <input name="label" type="text" required placeholder="Facture d'Eau">
            </div>
            <div style="width: 150px;">
                <label>Période</label>
                <input name="period" type="text" required placeholder="Décembre 2026">
            </div>
            <div style="width: 130px;">
                <label>Montant (TND)</label>
                <input name="amountTnd" type="number" step="0.5" min="1" required>
            </div>
            <div style="width: 160px;">
                <label>Échéance</label>
                <input name="dueDate" type="date" required>
            </div>
            <button type="submit" class="btn">Émettre</button>
        </form>
    </div>

    <div class="card">
        <h3>Suivi des Charges & Règlements</h3>
        <table>
            <thead>
            <tr>
                <th>Appartement</th>
                <th>Charge & Période</th>
                <th>Total (TND)</th>
                <th>Payé / Reste dû</th>
                <th>Statut</th>
                <th>Régler</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${charges}">
                <td th:text="'Apt ' + ${c.apartment.unitNumber} + ' · ' + ${c.apartment.buildingName}"></td>
                <td>
                    <strong th:text="${c.label}"></strong><br>
                    <small style="color: var(--muted);" th:text="${c.period + ' · Échéance ' + c.dueDate}"></small>
                </td>
                <td th:text="${c.totalAmountTnd + ' TND'}"></td>
                <td th:text="${c.paidAmountTnd + ' / ' + c.remainingAmountTnd + ' TND'}"></td>
                <td>
                    <span th:if="${c.status.name() == 'PAYE'}" class="pill pill-green">PAYÉ</span>
                    <span th:if="${c.status.name() == 'NON_PAYE'}" class="pill pill-amber">NON PAYÉ</span>
                    <span th:if="${c.status.name() == 'EN_RETARD'}" class="pill pill-red">EN RETARD</span>
                </td>
                <td>
                    <form th:if="${c.remainingAmountTnd > 0}" th:action="@{/charges/{id}/pay(id=${c.id})}"
                          method="post" class="form-inline">
                        <input name="amountTnd" type="number" step="0.5" min="1"
                               th:max="${c.remainingAmountTnd}" th:value="${c.remainingAmountTnd}"
                               style="width: 90px;" required>
                        <select name="paymentMode" style="width: 115px;">
                            <option value="CARTE">Carte</option>
                            <option value="VIREMENT">Virement</option>
                        </select>
                        <button type="submit" class="btn btn-sm">Payer</button>
                    </form>
                    <span th:if="${c.remainingAmountTnd <= 0}" style="color: var(--muted); font-size: 0.85rem;"
                          th:text="'Soldé (' + ${c.lastPaymentMode ?: '-'} + ')'"></span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
