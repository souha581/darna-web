<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Signalements & Interventions — DARNA</title>
    <link rel="stylesheet" th:href="@{/css/darna.css}">
</head>
<body>
<nav class="navbar">
    <a th:href="@{/dashboard}" class="brand">DARNA</a>
    <div class="nav-links">
        <a th:href="@{/dashboard}">Tableau de bord</a>
        <a th:if="${user.role.name() == 'OWNER'}" th:href="@{/apartments}">Appartements</a>
        <a th:if="${user.role.name() != 'OUVRIER'}" th:href="@{/charges}">Charges & Paiements</a>
        <a th:href="@{/repairs}">Signalements & Interventions</a>
        <form th:action="@{/logout}" method="post" style="display: inline;">
            <button type="submit" class="btn btn-sm btn-danger">Déconnexion</button>
        </form>
    </div>
</nav>

<div class="container">
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

    <div class="card" th:if="${user.role.name() == 'RESIDENT'}">
        <h3>Signaler un Problème Technique</h3>
        <form th:action="@{/repairs/report}" method="post" class="form-inline">
            <div style="width: 170px;">
                <label>Catégorie</label>
                <select name="category">
                    <option value="Plomberie">Plomberie</option>
                    <option value="Électricité">Électricité</option>
                    <option value="Ascenseur">Ascenseur</option>
                    <option value="Nettoyage">Nettoyage</option>
                </select>
            </div>
            <div style="width: 140px;">
                <label>Priorité</label>
                <select name="priority">
                    <option value="Basse">Basse</option>
                    <option value="Moyenne" selected>Moyenne</option>
                    <option value="Haute">Haute</option>
                </select>
            </div>
            <div style="flex: 1; min-width: 240px;">
                <label>Description</label>
                <input name="description" type="text" required placeholder="Décrivez la panne...">
            </div>
            <button type="submit" class="btn">Envoyer</button>
        </form>
    </div>

    <div class="card">
        <h3 th:text="${user.role.name() == 'OUVRIER'} ? 'Mon Carnet de Route (Interventions)' : 'Suivi des Signalements'"></h3>
        <table>
            <thead>
            <tr>
                <th>Localisation</th>
                <th>Catégorie & Description</th>
                <th>Intervenant</th>
                <th>Statut</th>
                <th>Action / Clôture</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${repairs}">
                <td th:text="${r.apartment.fullLocation}"></td>
                <td>
                    <strong th:text="${r.category + ' (' + r.priority + ')'}"></strong><br>
                    <span th:text="${r.description}"></span>
                    <div th:if="${r.closingReport != null}" style="color: var(--emerald); font-size: 0.85rem;"
                         th:text="'Rapport : ' + ${r.closingReport} + ' · Coût : ' + ${r.interventionCostTnd} + ' TND'"></div>
                </td>
                <td th:text="${r.assignedWorker != null} ? ${r.assignedWorker.fullName} : 'Non affecté'"></td>
                <td>
                    <span th:if="${r.status.name() == 'ENVOYEE'}" class="pill pill-amber">ENVOYÉE</span>
                    <span th:if="${r.status.name() == 'EN_COURS'}" class="pill pill-blue">EN COURS</span>
                    <span th:if="${r.status.name() == 'TERMINEE'}" class="pill pill-green">TERMINÉE</span>
                </td>
                <td>
                    <form th:if="${user.role.name() == 'OWNER' and r.status.name() != 'TERMINEE'}"
                          th:action="@{/repairs/assign}" method="post" class="form-inline">
                        <input type="hidden" name="repairId" th:value="${r.id}">
                        <select name="workerId" style="width: 160px;">
                            <option th:each="w : ${workers}" th:value="${w.id}" th:text="${w.fullName}"></option>
                        </select>
                        <button type="submit" class="btn btn-sm">Affecter</button>
                    </form>

                    <form th:if="${user.role.name() == 'OUVRIER' and r.status.name() != 'TERMINEE'}"
                          th:action="@{/repairs/close}" method="post" class="form-inline">
                        <input type="hidden" name="repairId" th:value="${r.id}">
                        <input name="costTnd" type="number" step="0.5" min="0" placeholder="Coût TND" style="width: 95px;" required>
                        <input name="report" type="text" placeholder="Rapport..." style="width: 150px;" required>
                        <button type="submit" class="btn btn-sm">Clôturer</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
