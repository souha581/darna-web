services:
  postgres:
    image: postgres:16-alpine
    container_name: darna-postgres-dev
    environment:
      POSTGRES_DB: ${DB_NAME:-darna_dev}
      POSTGRES_USER: ${DB_USER:-darna}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - darna_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-darna} -d ${DB_NAME:-darna_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - darna-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: darna-app-dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-darna_dev}
      DB_USER: ${DB_USER:-darna}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      APP_OWNER_USERNAME: ${APP_OWNER_USERNAME:-owner}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:-}
      APP_RESIDENT_USERNAME: ${APP_RESIDENT_USERNAME:-resident}
      APP_RESIDENT_PASSWORD: ${APP_RESIDENT_PASSWORD:-}
      APP_OUVRIER_USERNAME: ${APP_OUVRIER_USERNAME:-ouvrier}
      APP_OUVRIER_PASSWORD: ${APP_OUVRIER_PASSWORD:-}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - darna-net

volumes:
  darna_pgdata:

networks:
  darna-net:
    driver: bridge
