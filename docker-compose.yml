services:
  postgres:
    image: postgres:16-alpine
    container_name: darna-postgres-dev
    environment:
      POSTGRES_DB: darna_dev
      POSTGRES_USER: darna
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - darna_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darna -d darna_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - darna-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: darna-app-dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/darna_dev
      SPRING_DATASOURCE_USERNAME: darna
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
    ports:
      - "8080:8080"
    networks:
      - darna-net

volumes:
  darna_pgdata:

networks:
  darna-net:
    driver: bridge
