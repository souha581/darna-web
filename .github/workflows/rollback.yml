name: Rollback Test Environment

on:
  workflow_dispatch:
    inputs:
      target_image_tag:
        description: "Tag stable precedent dans GHCR (ex: sha-abc1234, develop, latest)"
        required: true
      reason:
        description: "Motif du rollback (reference fiche d'incident)"
        required: true
        default: "Incident detecte en environnement de test"

jobs:
  rollback-test:
    name: Execute Rollback & Verify Recovery
    runs-on: ubuntu-latest
    environment:
      name: test
      url: ${{ vars.TEST_APP_URL || 'http://localhost:8081' }}
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST_CONFIGURED: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve stable target image
        id: target
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAG="${{ github.event.inputs.target_image_tag }}"
          echo "image_ref=ghcr.io/${REPO_LOWER}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Rollback reason: ${{ github.event.inputs.reason }}"

      - name: Rollback via SSH (when remote DEPLOY_HOST secret is configured)
        if: env.DEPLOY_HOST_CONFIGURED != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ vars.DEPLOY_PATH || '~/darna-web' }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            DB_PASSWORD="${{ secrets.TEST_DB_PASSWORD }}" \
            APP_OWNER_PASSWORD="${{ secrets.TEST_OWNER_PASSWORD }}" \
            APP_RESIDENT_PASSWORD="${{ secrets.TEST_RESIDENT_PASSWORD }}" \
            APP_OUVRIER_PASSWORD="${{ secrets.TEST_OUVRIER_PASSWORD }}" \
            bash scripts/rollback.sh "${{ steps.target.outputs.image_ref }}" "${{ steps.target.outputs.version }}"

      - name: Simulate & verify rollback in Docker test stack
        if: env.DEPLOY_HOST_CONFIGURED == ''
        env:
          DARNA_IMAGE: ${{ steps.target.outputs.image_ref }}
          TEST_DB_SECRET: ${{ secrets.TEST_DB_PASSWORD }}
          TEST_OWNER_SECRET: ${{ secrets.TEST_OWNER_PASSWORD }}
          TEST_RESIDENT_SECRET: ${{ secrets.TEST_RESIDENT_PASSWORD }}
          TEST_OUVRIER_SECRET: ${{ secrets.TEST_OUVRIER_PASSWORD }}
          APP_SEED_ENABLED: "true"
        run: |
          export DB_PASSWORD="${TEST_DB_SECRET:-$(openssl rand -hex 16)}"
          export APP_OWNER_PASSWORD="${TEST_OWNER_SECRET:-$(openssl rand -hex 12)}"
          export APP_RESIDENT_PASSWORD="${TEST_RESIDENT_SECRET:-$(openssl rand -hex 12)}"
          export APP_OUVRIER_PASSWORD="${TEST_OUVRIER_SECRET:-$(openssl rand -hex 12)}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          bash scripts/rollback.sh "${{ steps.target.outputs.image_ref }}" "${{ steps.target.outputs.version }}"
          docker compose -f docker-compose.test.yml down

      - name: Archive rollback trace
        if: always() && hashFiles('deployments/history.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rollback-trace-${{ steps.target.outputs.version }}
          path: deployments/history.log
          retention-days: 30
