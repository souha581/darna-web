services:
  postgres-test:
    image: postgres:16-alpine
    container_name: darna-postgres-test
    environment:
      POSTGRES_DB: ${DB_NAME:-darna_test}
      POSTGRES_USER: ${DB_USER:-darna_test}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - darna_test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-darna_test} -d ${DB_NAME:-darna_test}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - darna-test-net

  app-test:
    image: ${DARNA_IMAGE:?DARNA_IMAGE must be set}
    container_name: darna-app-test
    restart: unless-stopped
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: test
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DB_HOST: postgres-test
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-darna_test}
      DB_USER: ${DB_USER:-darna_test}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      APP_OWNER_USERNAME: ${APP_OWNER_USERNAME:-owner}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:-}
      APP_RESIDENT_USERNAME: ${APP_RESIDENT_USERNAME:-resident}
      APP_RESIDENT_PASSWORD: ${APP_RESIDENT_PASSWORD:-}
      APP_OUVRIER_USERNAME: ${APP_OUVRIER_USERNAME:-ouvrier}
      APP_OUVRIER_PASSWORD: ${APP_OUVRIER_PASSWORD:-}
    ports:
      - "${TEST_SERVER_PORT:-8081}:8080"
    networks:
      - darna-test-net

volumes:
  darna_test_pgdata:

networks:
  darna-test-net:
    driver: bridge
